name: Backup Database

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    name: Create SQLite Backup on Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: production-backups
      cancel-in-progress: false
    steps:
      - name: Run backup script on Hetzner
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.HETZNER_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/below-your-means"
            fi

            cd "$APP_DIR"
            bash scripts/backup-db.sh "$APP_DIR"
