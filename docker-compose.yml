services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: belowyourmeans
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_PASSWORD=${APP_PASSWORD:?Set APP_PASSWORD in .env}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - DATABASE_PATH=/app/data/belowyourmeans.db
    volumes:
      - ./data:/app/data
    # Security: Limit container capabilities
    security_opt:
      - no-new-privileges:true
    # Security: Read-only root filesystem (except data volume)
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.next/cache:noexec,nosuid,size=128m
    # Security: Run as non-root user
    user: "1000:1000"
    # Security: Limit resources to prevent DoS
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Security: Disable network if not needed (enable for app)
    # network_mode: none
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
