services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: belowyourmeans
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_PASSWORD=${APP_PASSWORD:?Set APP_PASSWORD in .env}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - DATABASE_PATH=/app/data/belowyourmeans.db
    volumes:
      - ./data:/app/data
    # Security: Use isolated network with no internet access
    networks:
      - internal
    # Security: Limit container capabilities
    security_opt:
      - no-new-privileges:true
    # Security: Drop all capabilities except what's needed
    cap_drop:
      - ALL
    # Security: Limit resources
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Healthcheck using Node.js (no external tools)
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Reverse proxy to expose the app (only this has internet access)
  proxy:
    image: nginx:alpine
    container_name: belowyourmeans-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
      - external
    depends_on:
      - app
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

networks:
  # Internal network - NO internet access
  internal:
    driver: bridge
    internal: true
  # External network - for proxy only
  external:
    driver: bridge
