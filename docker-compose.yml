services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: belowyourmeans
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_PASSWORD=${APP_PASSWORD:?Set APP_PASSWORD in .env}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - DATABASE_PATH=/app/data/belowyourmeans.db
    volumes:
      - ./data:/app/data
    # Security: Limit container capabilities
    security_opt:
      - no-new-privileges:true
    # Security: Limit resources to prevent DoS
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Healthcheck using shell script
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
